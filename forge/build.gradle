plugins {
	id 'eclipse'
	id 'idea'
	id 'net.minecraftforge.gradle' version "${forgegradle_version}"
	id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
}

// 版本与根项目同源（gradle.properties 的 mod_version），不单独 bump
def rootProps = new Properties()
file('../gradle.properties').withInputStream { rootProps.load(it) }
version = "${rootProps.getProperty('mod_version')}"
group = rootProps.getProperty('maven_group')
base { archivesName = 'mcdebug-forge' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// dev-only GameTest harness: compiled and put on the run classpath, never shipped in the jar
sourceSets { devtest { compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
	runtimeClasspath += sourceSets.main.output } }
configurations { devtestImplementation.extendsFrom implementation }

minecraft {
	mappings channel: 'official', version: "${minecraft_version}"

	runs {
		server {
			workingDirectory project.file('run')
			property 'forge.logging.markers', 'REGISTRIES'
			property 'forge.logging.console.level', 'info'
			mods { mcdebug { source sourceSets.main } }
		}
		gameTestServer {
			workingDirectory project.file('run-gametest')
			property 'forge.logging.markers', 'REGISTRIES'
			property 'forge.logging.console.level', 'info'
			property 'forge.enabledGameTestNamespaces', 'mcdebug'
			if (project.hasProperty('devFlag')) property 'mcdebug.devtest.flag', project.property('devFlag')
			arg '--world'
			arg 'gametestworld'
			mods { mcdebug { source sourceSets.main; source sourceSets.devtest } }
		}
	}
}

repositories {
	mavenCentral()
	maven { url = 'https://maven.minecraftforge.net' }
	maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }
}

// 与 Fabric 版共享的、不依赖加载器/MC 类型的源文件：构建时同步到 build/ 下编译（不复制进仓库）。
// 注意 RpcHandler/RpcServer 引用 McDebugMod.LOGGER/MOD_VERSION 与 RpcEnv.gameDir，Forge 侧 McDebugMod 提供同名成员。
def sharedFiles = [
	'rpc/JsonRpc.kt', 'rpc/RpcErrors.kt', 'rpc/RpcHandler.kt', 'rpc/RpcServer.kt', 'rpc/RpcEnv.kt',
	'wait/PredicateExpr.kt',
]
tasks.register('syncShared', Sync) {
	from('../src/main/kotlin/com/mcdebug') { include sharedFiles }
	into layout.buildDirectory.dir('generated/shared/kotlin/com/mcdebug')
}
sourceSets.main.kotlin.srcDir(layout.buildDirectory.dir('generated/shared/kotlin'))
tasks.named('compileKotlin') { dependsOn 'syncShared' }

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
	kotlinOptions {
		jvmTarget = '17'
		// 语言版本跟随编译器（共享源码用到了 Kotlin 2.2+ 特性），但 API 面锁定 1.9：
		// 运行时 KotlinForForge 4.x 只带 Kotlin 1.9.x 标准库，禁止调用更新的标准库 API。
		apiVersion = '1.9'
	}
}

dependencies {
	minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
	implementation "thedarkcolour:kotlinforforge:${kff_version}"
}

jar {
	manifest { attributes 'Implementation-Title': 'mcdebug-forge', 'Implementation-Version': project.version }
}

processResources {
	inputs.property 'version', project.version
	filesMatching('META-INF/mods.toml') { expand 'version': project.version }
}
