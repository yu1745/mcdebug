// 独立 Gradle 构建（Gradle 8.1.1 + ForgeGradle 6）。根构建是 Gradle 9 + Loom，
// ForgeGradle 6 不能在 Gradle 9 下运行，所以 forge/ 自带 wrapper；
// 根构建通过 `:forge:build`（forge/delegate.gradle）委托调用本构建。
pluginManagement {
	repositories {
		gradlePluginPortal()
		maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
	}
}

rootProject.name = 'mcdebug-forge'
