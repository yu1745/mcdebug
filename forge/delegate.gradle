// Root-build view of the Forge port (Gradle 9 root; ForgeGradle 6 needs the nested Gradle 8.1.1 build).
// Each task below just runs the same-named task of the nested build in this directory.
// The real build script is forge/build.gradle (used by `cd forge && ./gradlew ...`).
//
// Gradle 8.1.1 cannot run on the JDK 21 this root build uses, so the nested wrapper is
// launched with a JDK 17 found through Gradle's toolchain detection (local /usr/lib/jvm,
// SDKMAN, ..., plus the JAVA_HOME_17_X64 variable GitHub runners set; see the root
// gradle.properties). Resolved at execution time, so other root tasks never need JDK 17.
// This project applies no Java plugin (it would add clashing build/assemble/clean tasks), so
// borrow the toolchain service from the root project, which applies java via Loom.
def java17 = rootProject.extensions.getByType(JavaToolchainService)
	.launcherFor { languageVersion = JavaLanguageVersion.of(17) }

['build', 'assemble', 'clean', 'compileKotlin', 'runServer', 'runGameTestServer'].each { taskName ->
	tasks.register(taskName, Exec) {
		group = 'forge'
		description = "Runs './gradlew ${taskName}' in forge/ (nested Gradle 8.1.1 + ForgeGradle 6 build)"
		workingDir = projectDir
		commandLine './gradlew', taskName, '--console=plain'
		// Dev server run tasks never return on their own; keep stdin attached off.
		standardInput = System.in
		doFirst {
			environment 'JAVA_HOME', java17.get().metadata.installationPath.asFile.absolutePath
		}
	}
}
