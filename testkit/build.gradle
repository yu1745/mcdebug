plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
    id 'maven-publish'
}

version = providers.gradleProperty('version').orNull ?: rootProject.property('maven_version')
group = providers.gradleProperty('group').orNull ?: rootProject.property('maven_group')
base.archivesName = 'mcdebug-testkit'

dependencies {
    api project(':sdk')
    api 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}
kotlin {
    jvmToolchain(25)
    compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 }
}
test { useJUnitPlatform() }
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'mcdebug-testkit'
            from components.java
        }
    }
}

apply from: '../gradle/maven-publishing.gradle'
