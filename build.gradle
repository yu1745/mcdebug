plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}" apply false
}

allprojects {
	repositories {
		mavenLocal()
		mavenCentral()
		maven { url "https://maven.fabricmc.net/" }
		maven { url "https://maven.blamejared.com/" }
		maven { url "https://api.modrinth.com/maven" }
		maven { url "https://maven.ftb.dev/releases" }
		maven { url "https://maven.architectury.dev/" }
		maven { url "https://maven.shedaniel.me/" }
		maven { url "https://maven.terraformersmc.com/releases/" }
		maven { url "https://jitpack.io" }
	}
}

apply plugin: 'net.fabricmc.fabric-loom-remap'
apply plugin: 'maven-publish'
apply plugin: 'org.jetbrains.kotlin.jvm'

version = providers.gradleProperty("version").orNull ?: project.mod_version
group = providers.gradleProperty("group").orNull ?: project.maven_group

base {
	archivesName = project.archives_base_name
}

sourceSets {
	main {
		// `contract` is a separate, zero-dependency artifact (published for CLI / JUnit
		// runner consumers), but the mod jar must be **self-contained**: a release jar is
		// dropped into `mods/` on its own, so a plain `implementation project(':contract')`
		// would leave `com.mcdebug.contract.Methods` missing at runtime and break the
		// client entrypoint with NoClassDefFoundError. Compiling the same sources into the
		// mod keeps one source of truth and zero runtime dependencies.
		kotlin.srcDir rootProject.file('contract/src/main/kotlin')
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mcdebug" {
			sourceSet sourceSets.main
			// The client source set (src/client/{kotlin,java,resources}) holds the
			// client-plane RPC agent (`gui.*`): real rendering + real Screen events.
			// Both source sets are packaged into the same jar.
			sourceSet sourceSets.client
		}
	}
}

// Unit-test pure client scheduling/geometry without starting Minecraft or a GL context.
sourceSets.test.compileClasspath += sourceSets.client.output
sourceSets.test.runtimeClasspath += sourceSets.client.output

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	// Surface test failures clearly in build output instead of swallowing them.
	testLogging {
		events "FAILED", "PASSED", "SKIPPED"
		exceptionFormat "full"
	}
}

// reflect.* name table (util/Mappings.kt): intermediary <-> Mojang for exactly this Minecraft
// version, taken from Loom's resolved mappings so it cannot drift from the game the jar targets.
def reflectMappingsDir = layout.buildDirectory.dir("generated/reflect-mappings")
def generateReflectMappings = tasks.register('generateReflectMappings') {
	def tiny = loom.mappingConfiguration.tinyMappings.toFile()
	def out = reflectMappingsDir.map { it.file("mappings/reflect.txt.gz") }
	inputs.file(tiny)
	outputs.file(out)
	doLast {
		def target = out.get().asFile
		target.parentFile.mkdirs()
		def header = tiny.withReader { it.readLine() }.split('\t')
		def inter = header.findIndexOf { it == 'intermediary' } - 3
		def named = header.findIndexOf { it == 'named' } - 3
		if (header[0] != 'tiny' || header[1] != '2' || inter < 0 || named < 0) {
			throw new GradleException("unexpected mappings header in $tiny: ${header.join(' ')}")
		}
		new java.util.zip.GZIPOutputStream(new FileOutputStream(target)).withWriter('UTF-8') { w ->
			boolean keep = false
			tiny.eachLine('UTF-8') { line ->
				def p = line.split('\t', -1)
				if (p[0] == 'c') {
					keep = p[1 + inter].startsWith('net/minecraft/')
					if (keep) w.write("c\t${p[1 + inter]}\t${p[1 + named]}\n")
				} else if (keep && p.length >= 6 && p[0] == '' && (p[1] == 'm' || p[1] == 'f')) {
					def i = p[3 + inter], n = p[3 + named]
					if (i != n && !n.startsWith('<')) w.write("${p[1]}\t$i\t$n\n")
				}
			}
		}
	}
}
sourceSets.main.resources.srcDir(files(reflectMappingsDir).builtBy(generateReflectMappings))

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
	kotlinOptions {
		jvmTarget = 21
		freeCompilerArgs += [
			"-Xemit-jvm-type-annotations"
		]
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.archives_base_name
	inputs.property "projectName", projectName
	from("LICENSE") { rename { "${it}_$projectName" } }
}

// The release jar is deployed on its own into `<gameDir>/mods` (server or client), so it
// must carry everything the two entrypoints touch. A missing class only shows up as a
// `NoClassDefFoundError` in a foreign environment — deps present in the dev classpath hide
// it (`contract` classes are the classic case). Fail the build instead.
tasks.register('verifyJarSelfContained') {
	description = 'Fail if the release jar misses classes/resources the entrypoints need at runtime'
	group = 'verification'
	def jarTask = tasks.named('remapJar')
	dependsOn jarTask
	doLast {
		def jarFile = jarTask.get().archiveFile.get().asFile
		def required = [
			'com/mcdebug/McDebugMod.class',                        // server entrypoint
			'com/mcdebug/client/McDebugClientMod.class',           // client entrypoint
			'com/mcdebug/client/GuiOps.class',                     // gui.* handlers
			'com/mcdebug/client/GuiInputOps.class',
			'com/mcdebug/client/GuiInputParams.class',
			'com/mcdebug/client/GuiInputValidation.class',
			'com/mcdebug/client/GuiInputModifiers.class',
			'com/mcdebug/client/GuiInputGestureState.class',
			'com/mcdebug/client/mixin/ScreenInputMixin.class',
			'com/mcdebug/client/Capture.class',
			'com/mcdebug/client/CaptureGeometry.class',
			'com/mcdebug/client/RenderCursor.class',
			'com/mcdebug/client/RenderControl.class',
			'com/mcdebug/client/RenderSchedule.class',
			'com/mcdebug/client/RenderSettings.class',
			'com/mcdebug/client/RenderMode.class',
			'com/mcdebug/client/mixin/MinecraftRenderMixin.class',
			'com/mcdebug/loader/LoaderApi.class',                    // loader 中立接缝（Fabric 与 NeoForge 各一份实现）
			'com/mcdebug/loader/StorageApi.class',
			'com/mcdebug/loader/fabric/FabricLoaderApi.class',
			'com/mcdebug/loader/fabric/FabricStorageApi.class',
			'com/mcdebug/client/ClientPlane.class',                 // 两个 loader 共用的客户端平面引导
			'com/mcdebug/client/loader/ClientLoaderApi.class',
			'com/mcdebug/client/loader/fabric/FabricClientLoaderApi.class',
			'com/mcdebug/client/mixin/MixinTargets.class',          // 每个 loader 一份的注入点常量
			'com/mcdebug/client/mixin/GameRendererMixin.class',
			'com/mcdebug/client/mixin/AbstractContainerScreenAccessor.class',
			'com/mcdebug/client/GuiClickOps.class',                // agent loop (0.7): settle/act/inspection
			'com/mcdebug/client/GuiScreenOps.class',
			'com/mcdebug/client/GuiDevOps.class',
			'com/mcdebug/client/GuiPointerOps.class',
			'com/mcdebug/client/GuiTargets.class',
			'com/mcdebug/client/ScreenFactory.class',
			'com/mcdebug/client/ScreenArgs.class',
			'com/mcdebug/client/ScreenReload.class',
			'com/mcdebug/client/ScreenClassLoader.class',
			'com/mcdebug/client/GuiSettle.class',
			'com/mcdebug/client/ProblemLog.class',
			'com/mcdebug/client/ScreenGuard.class',
			'com/mcdebug/client/DrawRecorder.class',
			'com/mcdebug/client/Annotator.class',
			'com/mcdebug/client/Hotswap.class',
			'com/mcdebug/client/mixin/ClientPacketListenerMixin.class',
			'com/mcdebug/client/mixin/GuiGraphicsMixin.class',
			'com/mcdebug/client/mixin/NativeImageAccessor.class',
			'com/mcdebug/client/mixin/ClientTextTooltipAccessor.class',
			'com/mcdebug/client/mixin/RenderSystemMixin.class',
			'com/mcdebug/contract/Methods.class',                  // contract used by the client self-check
			'mcdebug.mixins.json',
			'mcdebug.client.mixins.json',
			'fabric.mod.json',
			'mappings/reflect.txt.gz',                              // reflect.* names (generateReflectMappings)
		]
		def entries = new java.util.zip.ZipFile(jarFile).withCloseable { zip -> zip.entries().collect { it.name } as Set }
		def missing = required.findAll { !entries.contains(it) }
		if (missing) {
			throw new GradleException("${jarFile.name} is not self-contained, missing: ${missing}")
		}
		logger.lifecycle("verifyJarSelfContained: ${required.size()} required entries present in ${jarFile.name}")
	}
}

tasks.named('check') { dependsOn 'verifyJarSelfContained' }

publishing {
	publications {
		create("mavenJava", MavenPublication) { from components.java }
	}
	repositories { }
}
