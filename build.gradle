plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}" apply false
}

allprojects {
	repositories {
		mavenLocal()
		mavenCentral()
		maven { url = "https://maven.fabricmc.net/" }
		maven { url = "https://maven.blamejared.com/" }
		maven { url = "https://api.modrinth.com/maven" }
		maven { url = "https://maven.ftb.dev/releases" }
		maven { url = "https://maven.architectury.dev/" }
		maven { url = "https://maven.shedaniel.me/" }
		maven { url = "https://maven.terraformersmc.com/releases/" }
		maven { url = "https://jitpack.io" }
	}
}

apply plugin: 'net.fabricmc.fabric-loom'
apply plugin: 'maven-publish'
apply plugin: 'org.jetbrains.kotlin.jvm'

version = providers.gradleProperty("version").orNull ?: project.mod_version
group = providers.gradleProperty("group").orNull ?: project.maven_group

base {
	archivesName = project.archives_base_name
}

sourceSets {
	main {
		// `contract` is a separate, zero-dependency artifact (published for CLI / JUnit
		// runner consumers), but the mod jar must be **self-contained**: a release jar is
		// dropped into `mods/` on its own, so a plain `implementation project(':contract')`
		// would leave `com.mcdebug.contract.Methods` missing at runtime and break the
		// client entrypoint with NoClassDefFoundError. Compiling the same sources into the
		// mod keeps one source of truth and zero runtime dependencies.
		kotlin.srcDir rootProject.file('contract/src/main/kotlin')
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mcdebug" {
			sourceSet sourceSets.main
			// The client source set (src/client/{kotlin,java,resources}) holds the
			// client-plane RPC agent (`gui.*`): real rendering + real Screen events.
			// Both source sets are packaged into the same jar.
			sourceSet sourceSets.client
		}
	}
}

// Unit-test pure client scheduling/geometry without starting Minecraft or a GL context.
sourceSets.test.compileClasspath += sourceSets.client.output
sourceSets.test.runtimeClasspath += sourceSets.client.output

// Bundle only stdlib, without relocation or loader-specific Kotlin adapters.
configurations { shadedKotlin { transitive = false } }

dependencies {
	shadedKotlin "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"
	implementation "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	// Surface test failures clearly in build output instead of swallowing them.
	testLogging {
		events "FAILED", "PASSED", "SKIPPED"
		exceptionFormat = "full"
	}
}

// Minecraft 26.3 ships official names. Keep a class index for reflect's short names;
// members need no translation in either development or production.
def reflectMappingsDir = layout.buildDirectory.dir("generated/reflect-mappings")
def generateReflectMappings = tasks.register('generateReflectMappings') {
    def jars = provider { loom.minecraftProvider.minecraftJars }
    inputs.files(jars)
    outputs.dir(reflectMappingsDir)
    doLast {
        def target = reflectMappingsDir.get().file("mappings/reflect.txt.gz").asFile
        target.parentFile.mkdirs()
        def names = new TreeSet<String>()
        jars.get().each { file ->
            new java.util.zip.ZipFile(file.toFile()).withCloseable { zip ->
                zip.entries().each { entry ->
                    if (entry.name.startsWith('net/minecraft/') && entry.name.endsWith('.class')) {
                        names.add(entry.name.substring(0, entry.name.length() - 6))
                    }
                }
            }
        }
        new java.util.zip.GZIPOutputStream(new FileOutputStream(target)).withWriter('UTF-8') { w ->
            names.each { name -> w.write("c\t${name}\t${name}\n") }
        }
    }
}
sourceSets.main.resources.srcDir(files(reflectMappingsDir).builtBy(generateReflectMappings))

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25
        freeCompilerArgs.add('-Xemit-jvm-type-annotations')
    }
}

java {
	toolchain { languageVersion = JavaLanguageVersion.of(25) }
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from({ configurations.shadedKotlin.collect { zipTree(it) } }) {
		exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
		exclude 'module-info.class', 'META-INF/versions/**/module-info.class'
	}
	def projectName = project.archives_base_name
	inputs.property "projectName", projectName
	from("LICENSE") { rename { "${it}_$projectName" } }
}

// The release jar is deployed on its own into `<gameDir>/mods` (server or client), so it
// must carry everything the two entrypoints touch. A missing class only shows up as a
// `NoClassDefFoundError` in a foreign environment — deps present in the dev classpath hide
// it (`contract` classes are the classic case). Fail the build instead.
tasks.register('verifyJarSelfContained') {
	description = 'Fail if the release jar misses classes/resources the entrypoints need at runtime'
	group = 'verification'
	def jarTask = tasks.named('jar')
	dependsOn jarTask
	doLast {
		def jarFile = jarTask.get().archiveFile.get().asFile
		def required = [
			'kotlin/jvm/internal/Intrinsics.class',
			'kotlin/collections/CollectionsKt.class',
			'kotlin/enums/EnumEntriesKt.class',
			'com/mcdebug/McDebugMod.class',                        // server entrypoint
			'com/mcdebug/client/McDebugClientMod.class',           // client entrypoint
			'com/mcdebug/client/GuiOps.class',                     // gui.* handlers
			'com/mcdebug/client/input/GuiInputOps.class',
			'com/mcdebug/client/input/GuiInputParams.class',
			'com/mcdebug/client/input/GuiInputValidation.class',
			'com/mcdebug/client/input/GuiInputModifiers.class',
			'com/mcdebug/client/input/GuiInputGestureState.class',
			'com/mcdebug/client/mixin/ScreenInputMixin.class',
			'com/mcdebug/client/render/Capture.class',
			'com/mcdebug/client/render/CaptureGeometry.class',
			'com/mcdebug/client/render/RenderCursor.class',
			'com/mcdebug/client/render/RenderControl.class',
			'com/mcdebug/client/render/RenderSchedule.class',
			'com/mcdebug/client/render/RenderSettings.class',
			'com/mcdebug/client/render/RenderMode.class',
			'com/mcdebug/client/mixin/MinecraftRenderMixin.class',
			'com/mcdebug/loader/LoaderApi.class',                    // loader 中立接缝（Fabric 与 NeoForge 各一份实现）
			'com/mcdebug/loader/StorageApi.class',
			'com/mcdebug/loader/fabric/FabricLoaderApi.class',
			'com/mcdebug/loader/fabric/FabricStorageApi.class',
			'com/mcdebug/client/ClientPlane.class',                 // 两个 loader 共用的客户端平面引导
			'com/mcdebug/client/loader/ClientLoaderApi.class',
			'com/mcdebug/client/loader/fabric/FabricClientLoaderApi.class',
			'com/mcdebug/client/mixin/GameRendererMixin.class',
			'com/mcdebug/client/mixin/AbstractContainerScreenAccessor.class',
			'com/mcdebug/client/input/GuiClickOps.class',                // agent loop (0.7): settle/act/inspection
			'com/mcdebug/client/GuiScreenOps.class',
			'com/mcdebug/client/GuiDevOps.class',
			'com/mcdebug/client/input/GuiPointerOps.class',
			'com/mcdebug/client/input/GuiTargets.class',
			'com/mcdebug/client/input/ScreenFactory.class',
			'com/mcdebug/client/input/ScreenArgs.class',
			'com/mcdebug/client/devloop/ScreenReload.class',
			'com/mcdebug/client/devloop/ScreenClassLoader.class',
			'com/mcdebug/client/input/GuiSettle.class',
			'com/mcdebug/client/devloop/ProblemLog.class',
			'com/mcdebug/client/devloop/ScreenGuard.class',
			'com/mcdebug/client/render/DrawRecorder.class',
			'com/mcdebug/client/render/Annotator.class',
			'com/mcdebug/client/devloop/Hotswap.class',
			'com/mcdebug/client/mixin/ClientPacketListenerMixin.class',
			'com/mcdebug/client/mixin/GuiGraphicsMixin.class',
			'com/mcdebug/client/mixin/MixinTargets.class',
			'com/mcdebug/client/mixin/GuiTextRenderStateMixin.class',
			'com/mcdebug/client/mixin/AbstractWidgetAccessor.class',
			'com/mcdebug/client/mixin/GuiScreenAccessor.class',
			'com/mcdebug/client/mixin/NativeImageAccessor.class',
			'com/mcdebug/client/mixin/ClientTextTooltipAccessor.class',
			'com/mcdebug/client/mixin/RenderSystemMixin.class',
			'com/mcdebug/contract/Methods.class',                  // contract used by the client self-check
			'mcdebug.mixins.json',
			'mcdebug.client.mixins.json',
			'fabric.mod.json',
			'mappings/reflect.txt.gz',                              // reflect.* names (generateReflectMappings)
		]
		def entries = new java.util.zip.ZipFile(jarFile).withCloseable { zip -> zip.entries().collect { it.name } as Set }
		def missing = required.findAll { !entries.contains(it) }
		if (missing) {
			throw new GradleException("${jarFile.name} is not self-contained, missing: ${missing}")
		}
		logger.lifecycle("verifyJarSelfContained: ${required.size()} required entries present in ${jarFile.name}")
	}
}

tasks.named('check') { dependsOn 'verifyJarSelfContained' }

publishing {
	publications {
		create("mavenJava", MavenPublication) { from components.java }
	}
	repositories { }
}
