plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}" apply false
}

allprojects {
	repositories {
		mavenLocal()
		mavenCentral()
		maven { url "https://maven.fabricmc.net/" }
		maven { url "https://maven.blamejared.com/" }
		maven { url "https://api.modrinth.com/maven" }
		maven { url "https://maven.ftb.dev/releases" }
		maven { url "https://maven.architectury.dev/" }
		maven { url "https://maven.shedaniel.me/" }
		maven { url "https://maven.terraformersmc.com/releases/" }
		maven { url "https://jitpack.io" }
	}
}

apply plugin: 'net.fabricmc.fabric-loom-remap'
apply plugin: 'maven-publish'
apply plugin: 'org.jetbrains.kotlin.jvm'

version = providers.gradleProperty("version").orNull ?: project.mod_version
group = providers.gradleProperty("group").orNull ?: project.maven_group

base {
	archivesName = project.archives_base_name
}

sourceSets {
	main {
		// `contract` is a separate, zero-dependency artifact (published for CLI / JUnit
		// runner consumers), but the mod jar must be **self-contained**: a release jar is
		// dropped into `mods/` on its own, so a plain `implementation project(':contract')`
		// would leave `com.mcdebug.contract.Methods` missing at runtime and break the
		// client entrypoint with NoClassDefFoundError. Compiling the same sources into the
		// mod keeps one source of truth and zero runtime dependencies.
		kotlin.srcDir rootProject.file('contract/src/main/kotlin')
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mcdebug" {
			sourceSet sourceSets.main
			// The client source set (src/client/{kotlin,java,resources}) holds the
			// client-plane RPC agent (`gui.*`): real rendering + real Screen events.
			// Both source sets are packaged into the same jar.
			sourceSet sourceSets.client
		}
	}
}

// Unit-test pure client scheduling/geometry without starting Minecraft or a GL context.
sourceSets.test.compileClasspath += sourceSets.client.output
sourceSets.test.runtimeClasspath += sourceSets.client.output

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	// Surface test failures clearly in build output instead of swallowing them.
	testLogging {
		events "FAILED", "PASSED", "SKIPPED"
		exceptionFormat "full"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
	kotlinOptions {
		jvmTarget = 21
		freeCompilerArgs += [
			"-Xemit-jvm-type-annotations"
		]
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.archives_base_name
	inputs.property "projectName", projectName
	from("LICENSE") { rename { "${it}_$projectName" } }
}

// The release jar is deployed on its own into `<gameDir>/mods` (server or client), so it
// must carry everything the two entrypoints touch. A missing class only shows up as a
// `NoClassDefFoundError` in a foreign environment — deps present in the dev classpath hide
// it (`contract` classes are the classic case). Fail the build instead.
tasks.register('verifyJarSelfContained') {
	description = 'Fail if the release jar misses classes/resources the entrypoints need at runtime'
	group = 'verification'
	def jarTask = tasks.named('remapJar')
	dependsOn jarTask
	doLast {
		def jarFile = jarTask.get().archiveFile.get().asFile
		def required = [
			'com/mcdebug/McDebugMod.class',                        // server entrypoint
			'com/mcdebug/client/McDebugClientMod.class',           // client entrypoint
			'com/mcdebug/client/GuiOps.class',                     // gui.* handlers
			'com/mcdebug/client/Capture.class',
			'com/mcdebug/client/CaptureGeometry.class',
			'com/mcdebug/client/RenderCursor.class',
			'com/mcdebug/client/RenderControl.class',
			'com/mcdebug/client/RenderSchedule.class',
			'com/mcdebug/client/RenderSettings.class',
			'com/mcdebug/client/RenderMode.class',
			'com/mcdebug/client/mixin/MinecraftRenderMixin.class',
			'com/mcdebug/client/mixin/GameRendererMixin.class',
			'com/mcdebug/client/mixin/AbstractContainerScreenAccessor.class',
			'com/mcdebug/contract/Methods.class',                  // contract used by the client self-check
			'mcdebug.mixins.json',
			'mcdebug.client.mixins.json',
			'fabric.mod.json',
		]
		def entries = new java.util.zip.ZipFile(jarFile).withCloseable { zip -> zip.entries().collect { it.name } as Set }
		def missing = required.findAll { !entries.contains(it) }
		if (missing) {
			throw new GradleException("${jarFile.name} is not self-contained, missing: ${missing}")
		}
		logger.lifecycle("verifyJarSelfContained: ${required.size()} required entries present in ${jarFile.name}")
	}
}

tasks.named('check') { dependsOn 'verifyJarSelfContained' }

publishing {
	publications {
		create("mavenJava", MavenPublication) { from components.java }
	}
	repositories { }
}
