name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: create release and upload JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find the remapped JAR (exclude -dev, -sources, -all)
          JAR_FILE=$(find build/libs -name 'mcdebug-*.jar' \
            ! -name '*-dev.jar' ! -name '*-sources.jar' ! -name '*-all.jar' \
            | head -1)
          echo "Publishing: $JAR_FILE"

          # Rename to canonical name for the release
          mv "$JAR_FILE" "mcdebug-${{ steps.version.outputs.VERSION }}.jar"

          gh release create "${GITHUB_REF_NAME}" \
            "mcdebug-${{ steps.version.outputs.VERSION }}.jar" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
