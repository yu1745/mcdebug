name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build :cli:copyCliJar

      - name: extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: create release and upload JARs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The remapped mod jar is named after mod_version: a tag that does not match it fails here.
          VERSION="${{ steps.version.outputs.VERSION }}"
          CANONICAL="mcdebug-${VERSION}.jar"
          test -f "build/libs/$CANONICAL" || { echo "build/libs/$CANONICAL missing: tag v$VERSION != mod_version?"; ls build/libs; exit 1; }
          cp "build/libs/$CANONICAL" "$CANONICAL"

          # SHA256 sidecars: <filename>.sha256 contains just the hex digest.
          # mcdebug-cli.jar (built at the repo root, not in git) also carries the mod jar.
          for f in "$CANONICAL" mcdebug-cli.jar; do
            sha256sum "$f" | awk '{print $1}' > "$f.sha256"
            echo "SHA256 $f: $(cat "$f.sha256")"
          done

          gh release create "${GITHUB_REF_NAME}" \
            "$CANONICAL" \
            "${CANONICAL}.sha256" \
            mcdebug-cli.jar \
            mcdebug-cli.jar.sha256 \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
