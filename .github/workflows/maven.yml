name: publish Maven repository

on:
  push:
    branches: ['26.3']
    paths: ['gradle.properties', '.github/workflows/maven.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mcdebug-maven
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: maven
          path: maven-repository

      - name: check immutable version
        id: version
        shell: bash
        run: |
          MAVEN_VERSION=$(sed -n 's/^maven_version=//p' gradle.properties)
          test -n "$MAVEN_VERSION"
          echo "value=$MAVEN_VERSION" >> "$GITHUB_OUTPUT"
          present=0
          for artifact in mcdebug-contract mcdebug-sdk mcdebug-testkit mcdebug-neoforge; do
            if test -d "maven-repository/com/mcdebug/$artifact/$MAVEN_VERSION"; then
              present=$((present + 1))
            fi
          done
          if test "$present" -eq 4; then
            echo 'Already published; increase maven_version to publish changes.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          elif test "$present" -eq 0; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Incomplete existing version; refusing to overwrite immutable artifacts.' >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        if: steps.version.outputs.publish == 'true'
        id: java21
        with:
          java-version: 21
          distribution: temurin
      - uses: actions/setup-java@v4
        if: steps.version.outputs.publish == 'true'
        with:
          java-version: 25
          distribution: temurin

      - name: build and verify
        if: steps.version.outputs.publish == 'true'
        env:
          JAVA21_HOME: ${{ steps.java21.outputs.path }}
        run: ./gradlew build :cli:copyCliJar

      - name: stage Maven artifacts
        if: steps.version.outputs.publish == 'true'
        run: ./gradlew -p frontend -PmavenRepoDir="$GITHUB_WORKSPACE/maven-repository" stageMavenRepository

      - name: publish repository branch
        if: steps.version.outputs.publish == 'true'
        working-directory: maven-repository
        env:
          MAVEN_VERSION: ${{ steps.version.outputs.value }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p releases
          printf '%s\n' "$SOURCE_COMMIT" > "releases/$MAVEN_VERSION.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add com releases
          git commit -m "Publish mcdebug $MAVEN_VERSION"
          git push origin HEAD:maven
