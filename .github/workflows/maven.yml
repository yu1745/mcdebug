name: publish Maven repository

# 唯一的 Maven 分发通道（JitPack 已弃用）：暂存纯 JVM 构件（contract / sdk / testkit）与每个
# <mc, loader> 的预编译模组 JAR 到 GitHub `maven` 分支。构件清单只在 frontend/build.gradle 维护。
on:
  push:
    branches: ['main']
    # maven_version 是是否发布的唯一开关；已发布的版本会被下面的不可变检查跳过。
    paths: ['gradle.properties', 'frontend/**', 'gradle/maven-publishing.gradle', '.github/workflows/maven.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mcdebug-maven
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: maven
          path: maven-repository

      # 三个 Minecraft 版本各需自己的 JDK；根模块用 25 工具链。
      - name: setup jdk 17 (Minecraft 1.20.1, Gradle 8.1.1)
        id: java17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: setup jdk 21 (Minecraft 1.21.1)
        id: java21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: setup jdk 25 (Minecraft 26.3 and the JVM modules)
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: make gradle wrappers executable
        run: chmod +x ./gradlew versions/*/gradlew versions/*/neoforge/gradlew

      - name: check immutable version
        id: version
        shell: bash
        run: |
          # The artifact list comes from frontend/build.gradle, the single publishing entry point.
          ./gradlew -p frontend -q listPublicationArtifactIds | sort > artifact-ids.txt
          test -s artifact-ids.txt
          MAVEN_VERSION=$(sed -n 's/^maven_version=//p' gradle.properties)
          test -n "$MAVEN_VERSION"
          echo "value=$MAVEN_VERSION" >> "$GITHUB_OUTPUT"
          present=0
          total=0
          while read -r artifact; do
            total=$((total + 1))
            if test -d "maven-repository/com/mcdebug/$artifact/$MAVEN_VERSION"; then
              present=$((present + 1))
            fi
          done < artifact-ids.txt
          echo "$total artifacts; already present for $MAVEN_VERSION: $present"
          if test "$present" -eq "$total"; then
            echo 'Already published; increase maven_version to publish changes.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          elif test "$present" -eq 0; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            # A version may never change after publication, not even by gaining new artifacts.
            echo 'Incomplete existing version; refusing to overwrite immutable artifacts.' >&2
            exit 1
          fi

      - name: build and verify
        if: steps.version.outputs.publish == 'true'
        run: |
          # JVM modules, then every prebuilt mod jar the frontend publishes (five in total).
          ./gradlew build :cli:copyCliJar --console=plain
          (cd versions/mc26.3 && ./gradlew build :neoforge:build --console=plain)
          (cd versions/mc1.21.1 && JAVA_HOME="${{ steps.java21.outputs.path }}" ./gradlew build :neoforge:build --console=plain)
          (cd versions/mc1.20.1 && JAVA_HOME="${{ steps.java17.outputs.path }}" ./gradlew build --console=plain)

      - name: stage Maven artifacts
        if: steps.version.outputs.publish == 'true'
        run: ./gradlew -p frontend -PmavenRepoDir="$GITHUB_WORKSPACE/maven-repository" stageMavenRepository --console=plain

      - name: publish repository branch
        if: steps.version.outputs.publish == 'true'
        working-directory: maven-repository
        env:
          MAVEN_VERSION: ${{ steps.version.outputs.value }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p releases
          printf '%s\n' "$SOURCE_COMMIT" > "releases/$MAVEN_VERSION.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add com releases
          git commit -m "Publish mcdebug $MAVEN_VERSION"
          git push origin HEAD:maven
