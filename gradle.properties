# Done to increase the memory available to gradle.
# Kotlin + Loom 编译/数据生成较吃内存
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# The nested Forge build (forge/) runs on JDK 17. Besides auto-detected local JDKs, accept the
# JAVA_HOME_17_X64 variable that GitHub-hosted runners (and actions/setup-java) export.
org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64

# Fabric Properties
minecraft_version=1.21.1
loader_version=0.19.5
loom_version=1.15-SNAPSHOT
fabric_kotlin_version=1.13.9+kotlin.2.3.10

# Mod Properties
mod_version=0.6.2
maven_group=com.mcdebug
archives_base_name=mcdebug

# Dependencies
fabric_api_version=0.116.17+1.21.1
kotlin_version=2.3.10
