# ---- Gradle ----
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=false
# 根构建用 JDK 25 工具链编译与测试（Gradle 9.6 自动解析），产物字节码为 Java 17
org.gradle.java.installations.fromEnv=JAVA_HOME,JAVA21_HOME,JAVA25_HOME

# ---- 产品属性：三个 Minecraft 版本共用的唯一来源 ----
# 各版本目录的 gradle.properties 只放该版本专属的属性（MC / 加载器 / 构建插件版本）。
mod_version=0.8.0
# Maven coordinates include the Minecraft line; published versions are immutable.
maven_version=0.8.0-mc26.3
maven_group=com.mcdebug
kotlin_version=2.3.10
