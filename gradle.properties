# Done to increase the memory available to gradle.
# Kotlin + Loom 编译/数据生成较吃内存
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.java.installations.fromEnv=JAVA_HOME,JAVA21_HOME

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.17.21

# Mod Properties
mod_version=0.8.0
# Maven coordinates include the Minecraft line; published versions are immutable.
maven_version=0.8.0-mc26.3
maven_group=com.mcdebug
archives_base_name=mcdebug

# Dependencies
fabric_api_version=0.166.2+26.3
kotlin_version=2.3.10
