// 单仓多版本：根构建只管理纯 JVM 模块（contract / sdk / testkit / cli），不含任何
// Minecraft 依赖，也不加载 Loom / ModDevGradle / ForgeGradle。三个 Minecraft 版本各是
// 独立构建，见 versions/mc<ver>/（结构与验证矩阵见 docs/monorepo.md）。
pluginManagement {
	repositories {
		gradlePluginPortal()
		mavenCentral()
	}
}

rootProject.name = 'mcdebug'
include 'contract'
include 'sdk'
include 'testkit'
include 'cli'
