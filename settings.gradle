pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'mcdebug'
include 'contract'
include 'cli'

// NeoForge 移植是独立 Gradle 构建（ModDevGradle + 自带 wrapper），这里只做任务转发：
//   ./gradlew :neoforge:build      → neoforge/gradlew build
//   ./gradlew :neoforge:runServer  → neoforge/gradlew runServer
// 见 neoforge/delegate.gradle。
include 'neoforge'
project(':neoforge').buildFileName = 'delegate.gradle'
