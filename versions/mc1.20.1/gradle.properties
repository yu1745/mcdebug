# Minecraft 1.20.1（Forge）独立构建的专属属性。
# mod_version / maven_group / kotlin_version 在仓库根 gradle.properties，三个版本共用。
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Gradle 8.1.1 + ForgeGradle 6 需要 JDK 17（MC 1.20.1 也是 Java 17）：用 JAVA_HOME 指向 JDK 17 再运行 ./gradlew
org.gradle.java.installations.fromEnv=JAVA_HOME

minecraft_version=1.20.1
forge_version=47.4.0
forgegradle_version=6.0.6
# KotlinForForge 4.x 线（1.20.1），运行时自带 Kotlin 1.9.x 标准库
kff_version=4.11.0

# Mod Properties
archives_base_name=mcdebug-forge
