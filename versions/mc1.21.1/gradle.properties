# Minecraft 1.21.1 独立构建的专属属性。
# mod_version / maven_group / kotlin_version 在仓库根 gradle.properties，三个版本共用。
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.java.installations.fromEnv=JAVA_HOME,JAVA21_HOME,JAVA25_HOME
org.gradle.configuration-cache=false

# Fabric Properties
minecraft_version=1.21.1
loader_version=0.19.5
loom_version=1.15-SNAPSHOT

# Dependencies
fabric_api_version=0.116.17+1.21.1

# Mod Properties
archives_base_name=mcdebug
