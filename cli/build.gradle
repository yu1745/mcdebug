plugins {
	id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
	id 'application'
	id 'com.gradleup.shadow' version '9.0.0'
}

version = providers.gradleProperty("version").orNull ?: rootProject.property("mod_version")
group = providers.gradleProperty("group").orNull ?: rootProject.property("maven_group")

base {
	archivesName = 'mcdebug-cli'
}

dependencies {
	implementation project(':sdk')
	implementation 'com.google.code.gson:gson:2.11.0'
	implementation 'com.github.ajalt.clikt:clikt:4.4.0'
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
	testLogging {
		events "FAILED", "PASSED", "SKIPPED"
		exceptionFormat = "full"
	}
}

application {
	mainClass = 'com.mcdebug.cli.MainKt'
}

// Keep the complete skill trees in normal resources too (tests/installDist and the fat jar).
def bundledSkills = ['mcdebug', 'neoforge-fabric-port']
tasks.named('processResources') {
	bundledSkills.each { skill ->
		from(rootProject.file("skills/${skill}")) {
			into "META-INF/mcdebug/skills/${skill}"
		}
	}
	doLast {
		bundledSkills.each { skill ->
			def sourceDir = rootProject.file("skills/${skill}").toPath()
			def paths = rootProject.fileTree(sourceDir).files.collect {
				sourceDir.relativize(it.toPath()).toString().replace('\\', '/')
			}.sort()
			def index = new File(destinationDir, "META-INF/mcdebug/skills/${skill}.files")
			index.parentFile.mkdirs()
			index.text = paths.join('\n') + '\n'
		}
	}
}

// ---- 内嵌的模组 JAR ----
// The mod jars travel inside the CLI (`mcdebug jar --mc <line> --loader <loader>` writes one out):
// same repository, same mod_version, nothing is downloaded. The three Minecraft lines are
// independent builds that each need their own JDK (see versions/), so this build never triggers
// them. It only collects jars that already exist under versions/*/build/libs:
//   ./gradlew :cli:copyCliJar                      embed every built jar (all five when everything is built)
//   ./gradlew :cli:copyCliJar -PembedVersions=26.3 restrict to the listed Minecraft lines
// A listed line without any built jar fails the build; an unlisted/missing line is simply not embedded.
def modJarCandidates = [
	'26.3'  : [fabric  : "versions/mc26.3/build/libs/mcdebug-${version}.jar",
	           neoforge: "versions/mc26.3/neoforge/build/libs/mcdebug-neoforge-${version}.jar"],
	'1.21.1': [fabric  : "versions/mc1.21.1/build/libs/mcdebug-${version}.jar",
	           neoforge: "versions/mc1.21.1/neoforge/build/libs/mcdebug-neoforge-${version}.jar"],
	'1.20.1': [forge   : "versions/mc1.20.1/build/libs/mcdebug-forge-${version}.jar"],
]
// 路径相对仓库根（cli/ 只是子项目目录）。
def repoFile = { String relativePath -> rootProject.file(relativePath) }
def requestedVersions = (providers.gradleProperty('embedVersions').orNull ?: '')
	.split(',').collect { it.trim() }.findAll { !it.isEmpty() }
requestedVersions.each { line ->
	if (!(line in modJarCandidates)) {
		throw new GradleException("unknown -PembedVersions entry '$line' (expected one of ${modJarCandidates.keySet()})")
	}
}
// "<mc>/<loader>" -> file, for every built jar that should be embedded.
def embeddedModJars = [:]
modJarCandidates.each { line, loaders ->
	if (requestedVersions && !(line in requestedVersions)) return
	loaders.each { loader, path ->
		def jarFile = repoFile(path)
		if (jarFile.isFile()) embeddedModJars["${line}/${loader}".toString()] = jarFile
	}
}
requestedVersions.each { line ->
	if (!embeddedModJars.keySet().any { it.startsWith("${line}/") }) {
		throw new GradleException("-PembedVersions=${line}: no built mod jar under versions/mc${line}/*/build/libs; " +
			"build that Minecraft line first (see docs/monorepo.md)")
	}
}

tasks.shadowJar {
	archiveClassifier = ''
	archiveFileName = 'mcdebug-cli.jar'
	mergeServiceFiles()
	embeddedModJars.each { combination, jarFile ->
		def (line, loader) = combination.split('/') as List
		from(jarFile) {
			into "META-INF/mcdebug/${line}"
			rename { "${loader}.jar" }
		}
	}
	doLast {
		// `from(file)` silently skips a missing file: check the produced fat jar instead of trusting it.
		def required = embeddedModJars.keySet().collect { "META-INF/mcdebug/${it}.jar" }.sort()
		def zip = new java.util.zip.ZipFile(tasks.shadowJar.archiveFile.get().asFile)
		try {
			def missing = required.findAll { zip.getEntry(it) == null }
			if (!missing.isEmpty()) {
				throw new GradleException("CLI fat jar is missing embedded mod jars: ${missing} " +
					"(a version build was rewritten while the CLI was packaging; run again)")
			}
		} finally {
			zip.close()
		}
		if (embeddedModJars.isEmpty()) {
			logger.lifecycle("CLI fat jar embeds no mod jar (none built under versions/); " +
				"'mcdebug jar' will explain how to build them")
		} else {
			logger.lifecycle("CLI fat jar embeds mod jars: ${embeddedModJars.keySet().sort().join(', ')}")
		}
	}
	manifest {
		attributes 'Main-Class': application.mainClass.get()
		attributes 'Implementation-Version': project.version
	}
}

// 产出根目录的 mcdebug-cli.jar（固定名，不进 git）：冒烟脚本/本地使用，release.yml 把它传到 Release。
// 注意：不能用 Copy task —— Gradle 9 的 input snapshot 会扫描目标目录，
// 遇到 run/mcdebug/socket（unix socket）非普通文件直接失败；doLast 里拷贝不参与快照。
tasks.register('copyCliJar') {
	dependsOn tasks.shadowJar
	doLast {
		def src = tasks.shadowJar.archiveFile.get().asFile
		def dst = rootProject.file('mcdebug-cli.jar')
		java.nio.file.Files.copy(src.toPath(), dst.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
	}
}

// Build with the game's JDK 25; standalone CLI/contract bytecode remains Java 17 compatible.
java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
	jvmToolchain(25)
	compilerOptions {
		jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
	}
}

apply plugin: 'maven-publish'

publishing {
	publications {
		// shadowJar 与默认 jar 都是 null classifier，components.java 会冲突；
		// 显式只发布 shadowJar（fat jar，含 SDK/contract/gson/clikt）。
		create("mavenJava", MavenPublication) {
			artifactId = 'mcdebug-cli'
			artifact tasks.shadowJar
		}
	}
	repositories { }
}
