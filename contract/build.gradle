plugins {
	id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
}

version = providers.gradleProperty("version").orNull ?: rootProject.property("mod_version")
group = providers.gradleProperty("group").orNull ?: rootProject.property("maven_group")

base {
	archivesName = 'mcdebug-contract'
}

// 零依赖：DTO 是纯 data class，字段名即 JSON 字段名，
// 服务端（Gson）与未来 Kotlin 客户端（Gson 或 kotlinx）都能反射使用。

test {
	useJUnitPlatform()
	testLogging {
		events "FAILED", "PASSED", "SKIPPED"
		exceptionFormat "full"
	}
}

// 字节码目标 17（root loom 的 MC 1.20.1 要求 ≤17 运行时兼容），
// 但用 Gradle JVM（21）编译、不锁定 toolchain —— JitPack 只提供 JDK 21，
// jvmToolchain(17) 会因找不到 17 而构建失败。
java {
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
	compilerOptions {
		jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
	}
}

apply plugin: 'maven-publish'

publishing {
	publications {
		create("mavenJava", MavenPublication) { from components.java }
	}
	repositories { }
}
